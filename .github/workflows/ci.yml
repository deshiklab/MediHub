name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medihub
          POSTGRES_USER: medihub
          POSTGRES_PASSWORD: medihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medihub -d medihub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEDIHUB_DATABASE_URL: postgresql+asyncpg://medihub:medihub@127.0.0.1:5432/medihub
      MEDIHUB_TEST_DATABASE_URL: postgresql+asyncpg://medihub:medihub@127.0.0.1:5432/medihub
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps --only-shell chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - name: Run pytest
        run: |
          pytest -q > /tmp/pytest-output.txt 2>&1 || test_status=$?
          cat /tmp/pytest-output.txt
          if [ "${test_status:-0}" -ne 0 ]; then
            summary=$(tail -n 20 /tmp/pytest-output.txt | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Pytest failure::$summary"
            exit "$test_status"
          fi
