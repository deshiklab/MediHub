[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medihub"
version = "0.1.0"
description = "Python-first, edge-oriented medical-device integration gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
medihub = "medihub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
